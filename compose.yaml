# Local services for development. `./mvnw spring-boot:run` starts them automatically (Spring Boot's
# Docker Compose support) and points the app at them. Production uses a managed Postgres instead.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: playchale
      POSTGRES_PASSWORD: playchale
      POSTGRES_DB: playchale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playchale -d playchale"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
