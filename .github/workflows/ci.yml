# Every push and pull request: all the tests, against a real Postgres (Testcontainers uses the
# runner's Docker). On main, the image is then built and published to GitHub's container registry as
# ghcr.io/<owner>/playchale-api:<commit> and :latest, and deployed if a server is configured.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned rather than ubuntu-latest: that label becomes Ubuntu 26 from 19 October 2026, and a new
    # OS arriving under the build on GitHub's schedule turns into a red run nobody changed anything to
    # cause. Bump this deliberately instead.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Tests
        run: ./mvnw -B verify
        env:
          # Testcontainers' clean-up container (Ryuk) comes from Docker Hub, whose anonymous pulls
          # CI's shared machines run out of. The runner is thrown away after the job, so there's
          # nothing for it to clean up. Postgres itself comes from AWS's mirror (TestcontainersConfiguration).
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # The builder's own image from Google's mirror of Docker Hub (mirror.gcr.io), not Docker
          # Hub: anonymous pulls from CI's shared machines hit its rate limit (429) and its outages.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/playchale-api" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pulls the new image on the server and restarts the API. Off until the repository variable
  # DEPLOY_HOST and the secrets DEPLOY_USER / DEPLOY_SSH_KEY are set (see DEPLOYMENT.md).
  deploy:
    needs: image
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-24.04
    concurrency: production
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Waits for the new API to report ready (it runs any new migrations first) before calling
          # the deploy done.
          script: |
            set -e
            cd /opt/playchale
            docker compose pull api
            docker compose up -d api
            docker image prune -f
            for i in $(seq 1 24); do
              if curl -fsS https://api.playchale.com/actuator/health/readiness; then exit 0; fi
              sleep 5
            done
            docker compose logs --tail 50 api
            exit 1
