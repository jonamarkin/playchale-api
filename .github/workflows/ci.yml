# Every push and pull request: all the tests, against a real Postgres (Testcontainers uses the
# runner's Docker). On main, the image is then built and published to GitHub's container registry as
# ghcr.io/<owner>/playchale-api:<commit> and :latest, and deployed if a server is configured.
#
# Minutes: a private repository gets a monthly allowance, and every job is billed rounded up to the
# minute. So a run overtaken by a newer push is cancelled, changes to the docs, the server's config
# files (deploy/, copied to the server by hand) and the editor's settings don't run CI at all, and
# building, publishing and deploying are one job.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'deploy/**', '.vscode/**']
  pull_request:
    paths-ignore: ['**/*.md', 'deploy/**', '.vscode/**']

# A newer push to the same branch stops the run it overtook: only the latest commit's result matters,
# and it's the one that deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Pinned rather than ubuntu-latest: that label becomes Ubuntu 26 from 19 October 2026, and a new
    # OS arriving under the build on GitHub's schedule turns into a red run nobody changed anything to
    # cause. Bump this deliberately instead.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Tests
        run: ./mvnw -B verify
        env:
          # Testcontainers' clean-up container (Ryuk) comes from Docker Hub, whose anonymous pulls
          # CI's shared machines run out of. The runner is thrown away after the job, so there's
          # nothing for it to clean up. Postgres itself comes from AWS's mirror (TestcontainersConfiguration).
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  # The tests passed on main: the image, published under the commit and :latest, and the server pulls
  # it and restarts the API. The deploy is off until the repository variable DEPLOY_HOST and the
  # secrets DEPLOY_USER / DEPLOY_SSH_KEY are set (see DEPLOYMENT.md).
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # The builder's own image from Google's mirror of Docker Hub (mirror.gcr.io), not Docker
          # Hub: anonymous pulls from CI's shared machines hit its rate limit (429) and its outages.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/playchale-api" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Waits for the new API to report ready (it runs any new migrations first) before calling the
      # deploy done.
      - name: Pull and restart on the server
        if: ${{ vars.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/playchale
            docker compose pull api
            docker compose up -d api
            docker image prune -f
            for i in $(seq 1 24); do
              if curl -fsS https://api.playchale.com/actuator/health/readiness; then exit 0; fi
              sleep 5
            done
            docker compose logs --tail 50 api
            exit 1
