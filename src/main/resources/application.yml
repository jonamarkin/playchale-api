# Settings. Every value can be overridden by an environment variable: playchale.secret becomes
# PLAYCHALE_SECRET, spring.datasource.url becomes SPRING_DATASOURCE_URL, and so on.
#
# The values here are the production ones. On a laptop the dev profile adds application-dev.yml on
# top; `./mvnw spring-boot:run` and `./mvnw test` switch it on (see pom.xml). A deploy runs without
# it, and ProductionSafety refuses to start if dev-only settings leak in.

spring:
  application:
    name: playchale-api
  jackson:
    deserialization:
      # A field the API doesn't know is an error, so a mismatch with the web app shows up
      # immediately instead of being silently ignored.
      fail-on-unknown-properties: true
  mvc:
    # Unknown paths throw, so they get the same JSON error shape as everything else.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  threads:
    virtual:
      # One lightweight thread per request, so waiting on the database or the payment provider
      # doesn't tie up a scarce platform thread.
      enabled: true
  flyway:
    locations: classpath:db/migration
  jpa:
    properties:
      # When a list of rows each needs a related row, load those in batches of 50 rather than one
      # query each (the "N+1 queries" problem).
      hibernate.default_batch_fetch_size: 50
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration). Hibernate never changes it; it
      # only checks at startup that every entity matches its table, and refuses to start if not.
      ddl-auto: validate
    # Don't hold a database connection open while the response is written. Anything a response
    # needs is loaded inside the service method.
    open-in-view: false

server:
  port: ${PORT:8080}
  shutdown: graceful

# The API's own settings (config/PlaychaleProperties.java). Production sets PLAYCHALE_SECRET and
# PLAYCHALE_CORS_ORIGINS; there are deliberately no defaults for them.
playchale:
  secure-cookies: true
  test-support: false

logging:
  pattern:
    # Every line carries the request's ID (set by RequestLogFilter), so one request's lines can be
    # found together when something goes wrong.
    level: "%5p [%X{request_id:-}]"

# Spring Boot Actuator. /actuator/health checks the database too, so "UP" means "can serve
# requests"; /actuator/health/liveness and /readiness are for the load balancer. /actuator/info
# shows the build version.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
