<!-- The sign-in code email's card, placed inside layout.html. {{code}} is six digits. -->
<h1 class="pc-ink" style="margin:0 0 8px;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-0.01em;color:#0b1716;">Your sign-in code</h1>
<p class="pc-body" style="margin:0 0 24px;font-size:16px;line-height:24px;color:#2a3635;">Enter this code in PlayChale to sign in.</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center" style="background:#0c3a3a;border-radius:16px;padding:22px 12px;">
      <span style="font-family:'Onest',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:36px;line-height:44px;font-weight:600;letter-spacing:0.28em;padding-left:0.28em;color:#7cf0c8;">{{code}}</span>
    </td>
  </tr>
</table>
<p class="pc-body" style="margin:24px 0 0;font-size:15px;line-height:22px;color:#2a3635;">It expires in 10 minutes. Don’t share it with anyone: PlayChale will never ask you for it.</p>
<p class="pc-mute pc-rule" style="margin:24px 0 0;padding-top:20px;border-top:1px solid #e0e7e3;font-size:14px;line-height:21px;color:#64716f;">If you didn’t try to sign in to PlayChale, you can ignore this email. Nobody can sign in without the code.</p>
