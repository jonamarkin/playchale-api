<!--
  Something PlayChale wants to tell people who asked to hear from it: a new feature, a change worth
  knowing about. {{heading}} is the one line it's about, {{body}} the rest, {{action}}/{{actionUrl}}
  the single thing to do next. Every value is escaped by EmailLayout, so {{body}} is plain text —
  keep it to a paragraph or two rather than trying to send markup through it.
-->
<p class="pc-mute" style="margin:0 0 10px;font-size:13px;line-height:18px;letter-spacing:0.08em;text-transform:uppercase;color:#64716f;">{{label}}</p>
<h1 class="pc-ink" style="margin:0 0 12px;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-0.01em;color:#0b1716;">{{heading}}</h1>
<p class="pc-body" style="margin:0 0 24px;font-size:16px;line-height:25px;color:#2a3635;white-space:pre-line;">{{body}}</p>
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="background:#0c3a3a;border-radius:999px;">
      <a href="{{actionUrl}}" style="display:inline-block;padding:14px 26px;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:500;color:#7cf0c8;text-decoration:none;">{{action}}</a>
    </td>
  </tr>
</table>
