<!--
  Friday's ask to a host (WeekendNudge): they put a game on lately, nothing's on this weekend near
  them, and nothing of theirs is. Sent only to them, at most once a weekend.
-->
<h1 class="pc-ink" style="margin:0 0 8px;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-0.01em;color:#0b1716;">{{greeting}}</h1>
<p class="pc-body" style="margin:0 0 26px;font-size:16px;line-height:24px;color:#2a3635;">Put a game up: a place, a time, and a link for the group chat. It takes a minute, and anyone with the link can join.</p>
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr>
    <td style="background:#0c3a3a;border-radius:999px;">
      <a href="{{actionUrl}}" style="display:inline-block;padding:14px 26px;font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:500;color:#7cf0c8;text-decoration:none;">Put a game up</a>
    </td>
  </tr>
</table>
